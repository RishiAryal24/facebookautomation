services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: facebookautomation
      POSTGRES_USER: facebookautomation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facebookautomation -d facebookautomation"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      AUTH_COOKIE_SECURE: "true"
      SIMULATION_MODE: "false"
      DATABASE_URL: postgresql+asyncpg://facebookautomation:${POSTGRES_PASSWORD}@db:5432/facebookautomation
      BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:?Set BACKEND_CORS_ORIGINS in .env}'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - private

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - private

volumes:
  postgres_data:

networks:
  private:
    driver: bridge
